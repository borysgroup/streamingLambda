name: Deploy Lambda

# Updates the code of picam-lambda-function, the function behind LAMBDA_FUNCTION_URL.
# Only the code changes: the URL, role, env vars, runtime and memory stay as they are.
# `chalice deploy` can't do this (see issue 19), so build the zip and upload it directly.
on:
  push:
    branches:
      - main
    paths:
      - lambda_function.py
      - chalicelib/**
      - build-deployment-zip.sh
      - .github/workflows/deploy.yaml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build deployment.zip
        run: bash build-deployment-zip.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Update picam-lambda-function code
        run: |
          aws lambda update-function-code \
            --function-name picam-lambda-function \
            --zip-file fileb://deployment.zip \
            --query '{LastModified: LastModified, CodeSize: CodeSize, CodeSha256: CodeSha256}'
          aws lambda wait function-updated --function-name picam-lambda-function
